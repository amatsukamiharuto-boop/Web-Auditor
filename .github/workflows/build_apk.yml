name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Analyze, Test & Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Ensure Android Gradle wrapper and launcher icons
        run: |
          if [ ! -f android/gradlew ]; then
            TMP_DIR=$(mktemp -d)
            flutter create --platforms=android --org com.webauditor --project-name web_auditor "$TMP_DIR"
            cp "$TMP_DIR/android/gradlew" android/gradlew
            cp "$TMP_DIR/android/gradlew.bat" android/gradlew.bat
            mkdir -p android/gradle/wrapper
            cp "$TMP_DIR/android/gradle/wrapper/gradle-wrapper.jar" android/gradle/wrapper/gradle-wrapper.jar
            cp -rn "$TMP_DIR/android/app/src/main/res/mipmap-"* android/app/src/main/res/
            chmod +x android/gradlew
            rm -rf "$TMP_DIR"
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Run static analysis
        run: flutter analyze

      - name: Run unit tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-auditor-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
