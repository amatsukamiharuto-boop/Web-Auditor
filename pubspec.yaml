name: web_auditor
description: Aplikasi Android client-side untuk pengujian error halaman/tautan, audit keamanan pasif, dan analisis indikasi AI Slop pada website.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  html: ^0.15.4
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
